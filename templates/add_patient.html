{% extends "base.html" %}
{% block title %}Add patient | AI-Based Friendly Report Simplifier{% endblock %}
{% block content %}<div class="page-shell"><div class="surface form-card"><div class="eyebrow">Care workspace</div><h1>Add a patient record</h1><p>Create a record now, then connect medical reports to it as they arrive.</p>{% if error %}<div class="alert alert-error"><i data-lucide="circle-alert"></i> {{ error }}</div>{% endif %}<form action="/patients/add" method="POST"><div class="form-group"><label for="full_name">Full name <span aria-hidden="true">*</span></label><input id="full_name" type="text" name="full_name" placeholder="e.g. Jordan Lee" required></div><div class="form-row"><div class="form-group"><label for="age">Age</label><input id="age" type="number" name="age" placeholder="e.g. 45" min="0" max="120"></div><div class="form-group"><label for="gender">Gender</label><select id="gender" name="gender"><option value="">Select gender</option><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select></div></div><div class="form-row"><div class="form-group"><label for="blood_group">Blood group</label><select id="blood_group" name="blood_group"><option value="">Select blood group</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>O+</option><option>O-</option><option>AB+</option><option>AB-</option></select></div><div class="form-group"><label for="contact_phone">Phone number</label><input id="contact_phone" type="tel" name="contact_phone" placeholder="e.g. +1 555 0192"></div></div><div class="form-group"><label for="contact_email">Email address</label><input id="contact_email" type="email" name="contact_email" placeholder="patient@example.com"></div><button class="btn-primary" type="submit">Create patient record <i data-lucide="arrow-right"></i></button></form></div></div>{% endblock %}
