<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Medical Report Simplifier{% endblock %}</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fb; color: #1f2937; }
      .container { max-width: 980px; margin: 32px auto; padding: 0 20px; }
      .card { background: white; border: 1px solid #dfe7ef; border-radius: 12px; padding: 20px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04); }
      nav { display: flex; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid #e5e7eb; }
      a { color: #0f766e; text-decoration: none; }
      .actions { display: flex; gap: 12px; }
      table { width: 100%; border-collapse: collapse; margin-top: 12px; }
      th, td { padding: 10px 12px; border-bottom: 1px solid #e5e7eb; text-align: left; }
      form { display: grid; gap: 12px; }
      label { display: grid; gap: 6px; font-weight: 600; }
      input, button { padding: 10px 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; }
      button { background: #0f766e; color: white; border: none; cursor: pointer; }
      .button-secondary { background: #e2e8f0; color: #0f172a; }
      .error { color: #b91c1c; background: #fee2e2; padding: 12px; border-radius: 8px; }
      .muted { color: #64748b; }
      .grid { display: grid; gap: 12px; }
    </style>
  </head>
  <body>
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
